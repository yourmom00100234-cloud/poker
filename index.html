<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>골드 카지노</title>
    <style>
        body {
            background-color: #0a080d;
            color: #f8fafc;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        #authModal {
            background: #14101d;
            border: 2px solid #f59e0b;
            padding: 30px 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.3);
        }
        .modal-input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #3f321d;
            background: #1c1829;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 12px;
            outline: none;
            box-sizing: border-box;
        }
        .modal-btn {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(180deg, #f59e0b, #d97706);
            color: #000;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 6px;
        }
        /* 폼 바깥으로 빼내어 충돌 원천 차단된 토글 버튼 */
        .auth-toggle {
            margin-top: 16px;
            font-size: 0.9rem;
            color: #fef08a;
            cursor: pointer;
            text-decoration: underline;
            display: inline-block;
            padding: 6px;
        }
    </style>
</head>
<body>

    <div id="authModal">
        <h2 style="color: #f59e0b; margin-bottom: 5px;">👑 골드 카지노 👑</h2>
        <p id="authSub" style="color: #a1a1aa; font-size: 0.85rem; margin-bottom: 20px;">아이디와 비밀번호를 입력하세요</p>
        
        <!-- 로그인/회원가입 입력 폼 -->
        <form id="authForm" onsubmit="processAuth(); return false;">
            <input type="text" id="authId" class="modal-input" placeholder="아이디" required>
            <input type="password" id="authPw" class="modal-input" placeholder="비밀번호" required>
            <button type="submit" class="modal-btn" id="submitBtn">로그인</button>
        </form>

        <!-- 폼 바깥에 위치하여 절대 취소되지 않고 잘 눌리는 회원가입 전환 버튼 -->
        <div>
            <span id="authToggleText" class="auth-toggle" onclick="toggleMode()">계정이 없으신가요? 회원가입</span>
        </div>
    </div>

    <div id="gameScreen" style="display:none; text-align:center;">
        <h1 style="color: #f59e0b;">환영합니다! 접속 성공!</h1>
        <p id="welcomeMsg" style="font-size: 1.2rem;"></p>
    </div>

    <script>
        let isSignup = false;

        function toggleMode() {
            isSignup = !isSignup;
            document.getElementById('authSub').innerText = isSignup ? '새로운 계정을 만드세요' : '아이디와 비밀번호를 입력하세요';
            document.getElementById('submitBtn').innerText = isSignup ? '회원가입' : '로그인';
            document.getElementById('authToggleText').innerText = isSignup ? '이미 계정이 있으신가요? 로그인' : '계정이 없으신가요? 회원가입';
        }

        function processAuth() {
            const id = document.getElementById('authId').value.trim();
            const pw = document.getElementById('authPw').value.trim();

            if (!id || !pw) {
                alert('아이디와 비밀번호를 입력해주세요!');
                return;
            }

            const actionName = isSignup ? '회원가입' : '로그인';
            
            // 모달창 숨기고 게임 화면 표시
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            document.getElementById('welcomeMsg').innerText = `${id}님 ${actionName} 성공! (골드: 1,000G)`;
        }
    </script>
</body>
</html>
