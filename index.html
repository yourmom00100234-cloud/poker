<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>바카라 포커 경마</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151d30;
            --bg-input: #1a233a;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-gold: #fbbf24;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #26334d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            max-width: 480px;
            margin: 0 auto;
            padding: 12px;
            padding-bottom: 30px;
        }

        /* 닉네임 입력 모달 */
        #nameModal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 8, 15, 0.92);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 28px 20px;
            border-radius: 20px;
            width: 88%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .modal-title {
            font-size: 1.4rem;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .modal-sub {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .modal-input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: #fff;
            font-size: 1rem;
            text-align: center;
            margin-bottom: 16px;
            outline: none;
        }
        .modal-input:focus {
            border-color: var(--accent-blue);
        }
        .modal-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        /* 탭 네비게이션 */
        .nav-container {
            display: flex;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
        }
        .nav-btn {
            flex: 1;
            padding: 10px 0;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn.active {
            background: var(--accent-blue);
            color: white;
        }

        /* 프로필 / 자산 바 */
        .profile-bar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .user-name {
            font-weight: bold;
            font-size: 0.95rem;
        }
        .user-tier {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 6px;
            background: #1e293b;
            margin-left: 6px;
        }
        .gold-info {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--accent-gold);
        }
        .ad-recharge-btn {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 5px 9px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-left: 8px;
            cursor: pointer;
        }

        /* 탭 콘텐츠 */
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* 경마 트랙 */
        .track-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px 12px;
            margin-bottom: 12px;
        }
        .lane-row {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: 10px;
            padding: 6px 10px;
            margin-bottom: 8px;
            height: 40px;
            position: relative;
        }
        .lane-row:last-child { margin-bottom: 0; }
        .suit-icon {
            width: 24px;
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
        }
        .spade-color { color: #38bdf8; }
        .diamond-color { color: #f87171; }
        .heart-color { color: #f43f5e; }
        .club-color { color: #4ade80; }

        .horse-field {
            flex: 1;
            position: relative;
            height: 100%;
            margin: 0 10px;
            display: flex;
            align-items: center;
        }
        .horse-runner {
            position: absolute;
            left: 0%;
            transition: left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            font-size: 1.3rem;
        }
        .goal-line {
            width: 2px;
            height: 100%;
            background: #ef4444;
            position: absolute;
            right: 0;
            box-shadow: 0 0 6px #ef4444;
        }

        /* 최근 뽑힌 카드 현황 */
        .card-status-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .card-status-text {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--text-main);
            margin-top: 4px;
        }
        .card-display-box {
            width: 48px;
            height: 64px;
            background: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 800;
            color: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        /* 베팅 구역 */
        .bet-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 14px;
        }
        .sub-header {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-bottom: 8px;
        }
        .horse-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .horse-select-card {
            background: var(--bg-input);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .horse-select-card.active {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.15);
        }
        .horse-select-card span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .input-row {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: 10px;
            padding: 8px 14px;
            margin-bottom: 8px;
        }
        .input-row input {
            background: transparent;
